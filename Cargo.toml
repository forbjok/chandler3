html5ever = "0.26.0"
kuchikiki = "0.8.2"
once_cell = "1.18.0"
os_info = "3.7.0"
regex = "1.10.0"
reqwest = "0.11.22"
serde = "1.0.189"
serde_derive = "1.0.189"
serde_json = "1.0.107"
strum = "0.25.0"
strum_macros = "0.25.2"
sysinfo = "0.29.10"
thiserror = "1.0.49"
toml = "0.8.2"
tracing = "0.1.39"
